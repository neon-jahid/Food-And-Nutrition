<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Nutrition facts of foods by category, in English and Bangla." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NutriBase — Food & Nutrition</title>
    <script>
      // apply saved theme before paint to avoid flash
      try {
        var th = JSON.parse(localStorage.getItem("nutribase.theme"));
        if (th === "dark" || ((!th || th === "system") && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
        var ac = JSON.parse(localStorage.getItem("nutribase.accent"));
        if (ac && ac !== "fresh") document.documentElement.dataset.accent = ac;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
